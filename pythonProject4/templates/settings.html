<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки профиля — GameShop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% include 'header.html' %}

<main class="settings-main">
    <div class="settings-container">
        <h2>⚙️ Настройки аккаунта</h2>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="alert-success">{{ success }}</div>
        {% endif %}

        <section class="settings-section">
            <h3>👤 Личные данные</h3>
            <form action="{{ url_for('update_profile_settings') }}" method="POST">
                <div class="form-group">
                    <label for="nickname">Имя пользователя (Никнейм):</label>
                    <input type="text" id="nickname" name="nickname" value="{{ session.user_name }}" required>
                </div>
                <button type="submit" class="settings-btn">Сохранить изменения</button>
            </form>
        </section>

        <section class="settings-section">
            <h3>🔒 Смена пароля</h3>
            <form action="{{ url_for('change_password') }}" method="POST">
                <div class="form-group">
                    <label for="current_password">Текущий пароль:</label>
                    <input type="password" id="current_password" name="current_password" required>
                </div>
                <div class="form-group">
                    <label for="new_password">Новый пароль:</label>
                    <input type="password" id="new_password" name="new_password" required>
                </div>
                <button type="submit" class="settings-btn btn-danger">Обновить пароль</button>
            </form>
        </section>
    </div>
</main>

{% include 'footer.html' %}
</body>
</html>
